name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.3'
          cache-dependency-path: native/go.sum
      - name: Native tests and vet
        working-directory: native
        run: |
          go test -race -count=1 ./...
          go vet ./...

  android-build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.3'
          cache-dependency-path: native/go.sum
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned Android development packages
        shell: pwsh
        run: |
          $manager = Join-Path $env:ANDROID_HOME 'cmdline-tools/latest/bin/sdkmanager.bat'
          1..100 | ForEach-Object { 'y' } | & $manager --licenses | Out-Null
          & $manager 'platforms;android-35' 'build-tools;36.1.0' 'ndk;28.2.13676358'
          if ($LASTEXITCODE -ne 0) { throw 'Android development package installation failed' }
      - name: Build and verify unsigned APK
        shell: pwsh
        run: ./build.ps1
